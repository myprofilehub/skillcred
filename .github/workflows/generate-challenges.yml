name: Auto-Generate Code Arena Challenges

on:
  schedule:
    # Run twice a week: 
    # Sunday at 12:00 UTC (For Tuesday's Warm-up Round A)
    # Wednesday at 12:00 UTC (For Friday's Arena Round B)
    - cron: '0 12 * * 0,3'
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate new challenges using Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate-challenges

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add lib/challenges.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(arena): auto-generate new challenges via Gemini AI"
            git push
          fi
